<h1>CRYSTAL QUEST LOCAL <small>1.1.0</small></h1>
<p><a href="http://127.0.0.1:4174/" target="_blank" rel="noreferrer">ローカル起動画面を開く ↗</a></p>
<p>先に <code>npm run local</code> または「Start Crystal Quest.command」を起動してください。</p>
<p>魔法を選ぶ → 冒険を開始 → ローカル画面で撮影 → 写真を確認して「この写真で生成」。同じGeminiチャットへ添付・送信し、生成結果を確認します。</p>
<small>写真は確認ボタンを押した時だけGeminiへ送ります。写真をローカルサーバーやブラウザストレージへ保存する機能はありません。カメラのみを使い、マイクは要求しません。</small>
</html>
